# 本地开发基础设施：Postgres（生产同构）+ Redis（多实例协调；单实例可不启动）。
# 用法：
#   docker compose up -d
#   按 .env.example 配置 DATABASE_URL / REDIS_URL / PG_POOL_SIZE。
# 数据保存在 pgdata 卷；重置全部数据：docker compose down -v。
services:
  pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_crossborder
      POSTGRES_USER: smart_crossborder
      POSTGRES_PASSWORD: smart_crossborder
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smart_crossborder -d smart_crossborder']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    # 本地开发无密码；生产请改用受管 Redis 并配置 REDIS_URL 密码。
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
