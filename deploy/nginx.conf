# P10-01 生产反向代理（nginx）：TLS 终结 + 安全响应头 + 反代 Next.js。
# 证书目录 /etc/nginx/certs（fullchain.pem / privkey.pem）由部署侧挂载。
#
# 安全头策略：
#   HSTS      1 年 + includeSubDomains，禁止降级（上线首日建议缩短 max-age 便于撤除）
#   CSP       默认同源；frame-ancestors 'none'（不可被任何页面内嵌）
#   X-Frame-Options  DENY（与 CSP frame-ancestors 双保险）
#
# compose 部署：本文件由 docker-compose.prod.yml 挂载，upstream 指向 app-1/app-2；
# 裸机部署（nginx 与 next 同宿主机）：将 upstream server 行改为 127.0.0.1:3000。
upstream backend {
    server app-1:3000;
    server app-2:3000;
}
server {
    listen 80;
    server_name sumaitong.example;
    # 全量跳转 HTTPS（反代入口）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sumaitong.example;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # ---- P10-01 安全响应头（所有响应统一附加） ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
