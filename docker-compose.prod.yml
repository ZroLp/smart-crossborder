# P10-01 生产部署编排（叠加在 docker-compose.yml 之上，或直接使用本文件全量起栈）：
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 服务：app（本仓库构建）×2 实例（P2 多实例自动 worker：每实例启动时自动拉起
#       TaskQueueWorker，SKIP LOCKED 仲裁 + Redis 取消广播）+ nginx 反代（HSTS/CSP/X-Frame）。
# 密钥：全部经 .env 注入（SECRET_FAIL_FAST 默认开启，P10-03 缺密钥拒绝启动）。
services:
  app-1:
    build: .
    image: sumaitong:latest
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      PG_POOL_SIZE: ${PG_POOL_SIZE:-10}
      REDIS_URL: ${REDIS_URL:?REDIS_URL required in prod}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY required}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?PAYMENT_WEBHOOK_SECRET required}
      MAINTENANCE_SECRET: ${MAINTENANCE_SECRET:?MAINTENANCE_SECRET required}
      SEED_DEMO_DATA: "false"
      WORKER_AUTO_START: "true"
      SECRET_FAIL_FAST: "true"
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # 内部端口；对外仅由 nginx 暴露
    expose:
      - "3000"

  app-2:
    build: .
    image: sumaitong:latest
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      PG_POOL_SIZE: ${PG_POOL_SIZE:-10}
      REDIS_URL: ${REDIS_URL:?REDIS_URL required in prod}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY required}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?PAYMENT_WEBHOOK_SECRET required}
      MAINTENANCE_SECRET: ${MAINTENANCE_SECRET:?MAINTENANCE_SECRET required}
      SEED_DEMO_DATA: "false"
      WORKER_AUTO_START: "true"
      SECRET_FAIL_FAST: "true"
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "3000"

  pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_crossborder}
      POSTGRES_USER: ${POSTGRES_USER:-smart_crossborder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-smart_crossborder} -d ${POSTGRES_DB:-smart_crossborder}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?REDIS_PASSWORD required}']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  # P10-01 反代：nginx 终结 TLS + 安全响应头（HSTS/CSP/X-Frame-Options）。
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app-1
      - app-2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    # upstream 由 nginx.conf 内 proxy_pass 指向；compose 网络内可改 app-1:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
